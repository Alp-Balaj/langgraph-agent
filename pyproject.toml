[project]
name = "langgraph-agent"
version = "0.1.0"
description = "LangGraph tutorial project: state, nodes, edges and human-in-the-loop interrupts, with Claude"
readme = "README.md"
authors = [
    { name = "Alp Balaj", email = "alpbalaj1203@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
]

[project.scripts]
brief = "langgraph_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
